<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace Trivia Challenge</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Screen 1: Login -->
    <div id="screen-login" class="screen active">
      <h1>Workplace Trivia Challenge</h1>
      <p class="subtitle">Sign in with your Google account to play. Top 3 scores win prizes!</p>
      
      <button class="btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign in with Google
      </button>

      <button class="btn btn-secondary" onclick="openAdmin()">⚙️ Manage Questions (Admin)</button>
    </div>

    <!-- Screen 2: Game -->
    <div id="screen-game" class="screen">
      <div class="quiz-header">
        <span id="question-tracker">Question 1</span>
        <span id="score-tracker">Score: 0</span>
      </div>
      <div id="question-text" class="question-box"></div>
      <div id="options-container" class="options-grid"></div>
    </div>

    <!-- Screen 3: Results -->
    <div id="screen-results" class="screen">
      <h2>Game Over!</h2>
      <p class="subtitle" id="final-score-text"></p>
      <h3>Leaderboard</h3>
      <table>
        <thead><tr><th>Rank</th><th>Player</th><th>Score</th></tr></thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <button class="btn btn-secondary" onclick="location.reload()">Play Again</button>
    </div>

    <!-- Screen 4: Admin Panel -->
    <div id="screen-admin" class="screen">
      <h2>Manage Questions</h2>
      <p class="subtitle">Questions are saved securely to this browser.</p>
      
      <div class="admin-form">
        <h3>Add New Question</h3>
        <input type="text" id="new-q" placeholder="Type the question here..." required>
        <input type="text" id="opt-0" placeholder="Option 1" required>
        <input type="text" id="opt-1" placeholder="Option 2" required>
        <input type="text" id="opt-2" placeholder="Option 3" required>
        <input type="text" id="opt-3" placeholder="Option 4" required>
        <select id="correct-opt">
          <option value="0">Option 1 is correct</option>
          <option value="1">Option 2 is correct</option>
          <option value="2">Option 3 is correct</option>
          <option value="3">Option 4 is correct</option>
        </select>
        <button class="btn" onclick="addQuestion()">Save Question</button>
      </div>

      <div id="admin-question-list" style="margin-bottom: 20px;"></div>
      
      <button class="btn btn-secondary" onclick="switchScreen('screen-login')">← Back to Login</button>
      <button class="btn btn-danger" onclick="resetDefaults()">Reset to Default Questions</button>
    </div>
  </div>

  <!-- Link to External JavaScript -->
  <script src="app.js"></script>
</body>
</html>
